name: quality

on:
  push:
    branches:
      - main
      - feature/security-intelligence
  pull_request:
    branches:
      - main

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source
        run: python -m py_compile security_intelligence.py bot.py

      - name: Verify direct security integration
        run: |
          python -m py_compile bot.py security_intelligence.py
          python - <<'PY'
          import bot
          from security_intelligence import SecurityIntelligence
          assert isinstance(bot._security_intelligence, SecurityIntelligence)
          output = bot._render_scan_results([{
              "chainId": "solana",
              "baseToken": {"symbol": "TEST"},
              "_analysis": {"opportunity_score": 50, "verdict": "WATCH", "risk_flags": [], "anomalies": [], "unknown": []},
              "_developer": {},
              "_smart_wallet": {},
              "_security": {"security_score": None, "risk": "INCONCLUSIVE", "confidence": "LOW"},
              "priceUsd": "0.001",
              "marketCap": 10000,
              "liquidity": {"usd": 5000},
              "volume": {"h24": 1000},
              "pairCreatedAt": 1,
              "txns": {"h24": {"buys": 1, "sells": 1}},
              "priceChange": {"h24": 1},
              "url": "https://example.com",
          }])
          assert "🔐 SECURITY" in output
          assert "Risk: INCONCLUSIVE | Confidence: LOW" in output
          PY

      - name: Run security unit tests
        run: python -m unittest test_security_intelligence.py -v

      - name: Build deployment image
        run: docker build --tag memefinder1000x:quality .
